E_SELF_MODIFICATION true\nPOLICY_AUTONOMY_MODE apply\nPOLICY_REQUIRE_SIGNED_MUTATION_GRANT false\nPOLICY_MAX_ITERATIONS_PER_HOUR 60\n```\n\n`node dist/src/cli/main.js doctor` in the same workspace:\n\n```\n\"mutationGrantSecretConfigured\": false\n```\n\nThe sibling project `projects/nanobionic-laboratory` still carries the shipped default\n(`false` / `propose` / `true`).\n\n## Why this matters\n\nThese three lines are the whole authority boundary for code mutation. Set this way the\nruntime may rewrite its own sources, in `apply` mode, and **no signed grant is required**.\n\nThe sharp part is the combination: `MUTATION_GRANT_HMAC_SECRET` is **not set**, so even\nturning `POLICY_REQUIRE_SIGNED_MUTATION_GRANT` back on would not produce a working gate —\ngrants could be neither issued nor verified. There is currently no configuration of this\nproject in which a mutation is cryptographically authorised.\n\n`docs/FULL_AUTONOMY_GAPS.md` names `allowRuntimeSelfModification=false` as the deliberate\nfail-closed default, and lists thirteen preconditions for lifting it. At least these are\nnot met today: no container isolation, no post-apply gates, no canary/rollback, no\nindependent evaluator identity, no promotion path out of the isolated workspace.\n\nThis ticket does **not** assume the change was a mistake — enabling autonomy is a plausible\nintent. It asserts that the change is currently unsupported by the machinery it depends on.\n\n## Acceptance criteria\n\nEither:\n\n- **(a) Restore fail-closed** — `false` / `propose` / `true`, and record why apply mode was\n  wanted so the requirement is not lost; or\n- **(b) Make apply mode real** — set `MUTATION_GRANT_HMAC_SECRET`, re-enable\n  `POLICY_REQUIRE_SIGNED_MUTATION_GRANT true`, and land the preconditions in\n  `docs/FULL_AUTONOMY_GAPS.md` items 3, 4, 6, 12, 13 before any unattended run.\n\nIn both cases: `diagnose-agent scan` reports no `CFG-603`, and a test asserts the shipped\nwizard default cannot silently drift.\n\nAlso review `POLICY_MAX_ITERATIONS_PER_HOUR 60` (was 12): with apply mode this is the rate\nlimit on self-modification, not just on iteration.\n\n## Operational state (2026-08-08)\n\nThe gate now blocks pushes on this finding — that is the corrected multi-project scan from\nticket-11 doing its job:\n\n```\nPASS  diagnose:nanobionic-laboratory      (no findings at or above: error)\nFAIL  diagnose:nanobionic-laboratory-md   (findings at or above: error)\n1 stage(s) failed — not ready to push.\n```\n\nOne `git push --no-verify` was used deliberately, with the operator's decision, to land the\ndocs and CI commits (`40d8b56`, `b4bf25d`) while this ticket stays open. **Every subsequent\npush to `main` will be blocked until this is resolved** — by design, not by accident.\n\n`repair-agent` already offers the mechanical half:\n\n```bash\nnode ../repair-agent/dist/src/cli.js fix .ci-reports/diagnostic-report-nanobionic-laboratory-md.json\n# PLANNED  CFG-603  strategy: restore-policy\n```\n\nIt is a dry run until `--apply` is passed. The decision the strategy cannot make is (a)\nversus (b) above — whether apply mode was wanted at all.\n", "is_subdir": false}, {"name": "ticket-02-runtime-generation-not-landed.md", "rel_path": "ticket-02-runtime-generation-not-landed.md", "path": "ticket-02-runtime-generation-not-landed.md", "size": "2.4KB", "icon": "📝", "type": "markdown", "type_name": "Markdown", "content": "---\nid: ticket-02\nsignal: manual\ntitle: A runtime fix still does not reach existing projects — RUNTIME_GENERATION is uncommitted\npriority: high\nlabels: [autonomy, feedback-loop, blocker]\nfiles:\n  - src/core/generation.ts\n  - src/core/types.ts\n  - src/runtime/living-project.ts\ndedupe_key: manual:runtime-generation-uncommitted\n---\n\n## Evidence\n\nAn iteration is skipped (`noChange: true`) when four input hashes match: project config,\nresearch snapshot, development fingerprint, observation snapshot. The **runtime itself was\nnot part of that key**.\n\nObserved directly while fixing `cadAssetCount` (ticket-03's sibling, now landed in\n`5ce6523`): the fix was built into `dist/`, the iteration was re-run, and it reported\n\n```\n\"noChange\": true\nbioprinter_mos3s_01 cadAssetCount: undefined\n```\n\nThe corrected code never ran. Only after adding `RUNTIME_GENERATION` to the short-circuit\nkey did the same command report `noChange: false` and the expected `cadAssetCount: 14`.\n\nThe fix exists in the working tree (`src/core/generation.ts` plus wiring) but is **not\ncommitted**: my change to `stableKey` sits on the same line as an `intentDsl` field added by\nparallel work, so extracting it alone yields a tree that does not compile.\n\n## Why this matters\n\nThis is a precondition for any feedback loop, not a nicety. Without it the system cannot\nobserve its own correction: a fix ships, every input hash stays identical, and every existing\ntwin keeps serving values the old code produced — indefinitely, and silently.\n\nIt also means the two fixes already pushed (`5ce6523`, `801b4bd`) do **not** propagate to\n`projects/nanobionic-laboratory` or any other existing project until something else changes\nits inputs.\n\n## Acceptance criteria\n\n- `RUNTIME_GENERATION` participates in the `noChange` short-circuit and is recorded on the\n  iteration receipt.\n- `DT_FORCE_ITERATION=1` forces re-derivation without a bump.\n- A test asserts that a changed generation constant defeats the short-circuit on otherwise\n  identical inputs.\n- `docs/` states the bump rule: bump when output from unchanged inputs would differ\n  (grounding, blueprint matching, evidence ranking, scene layout); do not bump for docs,\n  tests or logging, because a needless bump costs every project a full regeneration.\n\n## Note\n\nLands together with the parallel `intentDsl` work — they share a line and cannot be\nseparated. Whoever commits that work should include this.\n", "is_subdir": false}, {"name": "ticket-03-development-loop-is-a-fixture.md", "rel_path": "ticket-03-development-loop-is-a-fixture.md", "path": "ticket-03-development-loop-is-a-fixture.md", "size": "2.0KB", "icon": "📝", "type": "markdown", "type_name": "Markdown", "content": "---\nid: ticket-03\nsignal: manual\ntitle: The development loop is a fixture — todo2code is not installed, and policy hides it\npriority: high\nlabels: [autonomy, evidence, development-loop]\nfiles:\n  - src/adapters/todo2code.ts\n  - ../projects/nanobionic-laboratory-md/project.projectdsl\ndedupe_key: manual:development-evidence-fixture\n---\n\n## Evidence\n\n`node dist/src/cli/main.js doctor`:\n\n```json\n\"todo2code\": { \"root\": \"\", \"bin\": \"\", \"available\": false }\n```\n\n`projects/nanobionic-laboratory-md/feedback/latest.md`:\n\n```\nDevelopment source: fixture\nDevelopment acceptance: accepted\n```\n\n`project.projectdsl` carries `POLICY_ALLOW_DEVELOPMENT_FIXTURE true`, and\n`DEVELOPMENT_FIXTURE \"config/development.intent.fixture.json\"`.\n\n## Why this matters\n\nThe README describes three loops, of which the development loop compares intent against\ncode, tests and Git. That comparison is not happening. A fixture is being accepted as\nevidence and reported as `accepted`, so every gate downstream sees a green development\nsignal that was never derived from the repository.\n\nThe fixture path is deliberate and correctly requires explicit policy — that design is\nright. The problem is that in this project the escape hatch is load-bearing rather than a\nfallback, and nothing surfaces the difference except one line in a feedback file.\n\n`docs/FULL_AUTONOMY_GAPS.md` item 1 names exactly this: \"Real `todo2code` checkout in CI and\nlive semantic benchmark (not only adapter + empty local proposal).\"\n\n## Acceptance criteria\n\n- `scripts/bootstrap-todo2code.sh` (already generated per project) is run, or `T2C_ROOT` /\n  `T2C_BIN` point at a real checkout, and `doctor` reports `available: true`.\n- An iteration produces `Development source: todo2code` with real diagnostics.\n- `diagnose-agent` gains a finding for \"development evidence is a fixture while the policy\n  permits it\" so the substitution is visible without reading `feedback/latest.md`\n  (see ticket-06).\n- Decide whether `POLICY_ALLOW_DEVELOPMENT_FIXTURE` should stay `true` for this project once\n  the real adapter works.\n", "is_subdir": false}, {"name": "ticket-04-feedback-has-no-actuation.md", "rel_path": "ticket-04-feedback-has-no-actuation.md", "path": "ticket-04-feedback-has-no-actuation.md", "size": "2.2KB", "icon": "📝", "type": "markdown", "type_name": "Markdown", "content": "---\nid: ticket-04\nsignal: manual\ntitle: The feedback loop carries information but nothing acts on it\npriority: high\nlabels: [autonomy, feedback-loop, improvement-dsl]\nfiles:\n  - src/runtime/living-project.ts\n  - src/dsl/improvement.ts\n  - ../projects/nanobionic-laboratory-md/feedback/latest.md\ndedupe_key: manual:improvement-propose-only-no-actuation\n---\n\n## Evidence\n\nThe loop *is* wired, and that part works: `feedback/latest.md` is written by the runtime and\ndeclared as a source, so the next iteration re-ingests it —\n\n```\nSOURCE derived \"feedback\" subactor://project/nanobionic-laboratory-md/feedback feedback\n```\n\nIts content today:\n\n```\n## Proposed improvements\n- [ ] Review rejected LLM authority override — LLM_AUTHORITY_EXPRESSION_IGNORED:DevelopmentGate\n```\n\n`current/improvement.json` holds one action, of kind `validation`. Grepping\n`src/runtime/living-project.ts` finds no path that reads a previous improvement plan and\nacts on it.\n\n## Why this matters\n\nThe information half of the feedback loop is closed; the actuation half is not. An\nunchecked Markdown checkbox is not a control signal — it is re-ingested as prose, contributes\nto the source snapshot hash, and is never executed. The item above has been sitting\nunactioned across iterations, and nothing escalates it or times it out.\n\nThis is the difference between a system that *records* what it should improve and one that\n*improves*. For the autonomous loop the user is asking for, this is the missing half.\n\nNote the specific unactioned item is itself worth reading: the runtime rejected an LLM\nattempt to redefine `DevelopmentGate` authority. The gate held — which is correct — but\nnobody has looked at why the model tried.\n\n## Acceptance criteria\n\n- Improvement actions carry a machine-readable status (`proposed` / `accepted` / `rejected` /\n  `done`) rather than only a Markdown checkbox, and the status survives iterations.\n- The runtime reads the previous plan and reports which actions are still open and for how\n  many iterations.\n- An action open beyond a threshold raises a finding rather than scrolling past.\n- Decide explicitly which action kinds may ever self-execute; `validation` is a safe first\n  candidate, code mutation is governed by ticket-01 and must not be included by default.\n", "is_subdir": false}, {"name": "ticket-05-no-probe-for-fixed-defect-classes.md", "rel_path": "ticket-05-no-probe-for-fixed-defect-classes.md", "path": "ticket-05-no-probe-for-fixed-defect-classes.md", "size": "2.5KB", "icon": "📝", "type": "markdown", "type_name": "Markdown", "content": "---\nid: ticket-05\nsignal: manual\ntitle: diagnose-agent cannot detect the two defect classes just fixed\npriority: medium\nlabels: [diagnose-agent, coverage, regression-risk]\nfiles:\n  - ../diagnose-agent/src/probes/artifacts.ts\n  - ../diagnose-agent/src/probes/corpus.ts\n  - ../diagnose-agent/src/codex/codex.json\ndedupe_key: manual:diagnose-coverage-intake-and-cad\n---\n\n## Evidence\n\nTwo of the three defects fixed on 2026-08-08 were found **by running the system**, not by\nany probe, and no probe would find them again:\n\n| defect | detectable today? |\n| --- | --- |\n| intake discarding established evidence (`801b4bd`) | no |\n| `cadAssetCount` blind to f2md corpora (`5ce6523`) | no |\n| stale placeholder label | yes — `ART-406` |\n\nOnly the third had a probe, and it is the least serious of the three.\n\n## Why this matters\n\nThe gate is the thing that is supposed to notice regressions. It currently notices the\ncosmetic defect and misses the data-loss one. If the intake merge regresses, the first\nsignal will again be a human posting two documents and watching evidence disappear.\n\nBoth classes are mechanically detectable from artifacts already on disk.\n\n## Proposed checks\n\n**`ART-407` — baseline evidence not reflected in the twin.** Compare\n`baseline/physical-evidence.json` against `current/twin.json`: a component with a record in\nthe baseline whose twin `geometryEvidence` is weaker than that record's grade means evidence\nwas written but not applied, or was applied and later lost. That is exactly the shape the\ndata-loss bug produced.\n\n**`COR-207` — corpus vocabulary does not reach the blueprint.** Count resources whose\n`sourcePath` carries a CAD extension (allowing the f2md `.md` tail) and compare against the\nsum of `cadAssetCount` across components. A large corpus-side count with near-zero\ncomponent-side count means the blueprint's matching vocabulary has drifted from the corpus —\nthe general form of the `.stl.md` bug, and it would also catch a future mirror that renames\nfiles differently.\n\n**`ART-408` — twin derived by an older runtime generation.** Once ticket-02 lands, compare\nthe receipt's `runtimeGeneration` against the installed one and report a stale twin.\n\n## Acceptance criteria\n\n- Three codex entries with meaning, causes, impact and repair route.\n- Probes implemented with tests built from the real failure shapes, not synthetic ones.\n- Running the new probes against the repository state *before* `5ce6523` / `801b4bd` would\n  have produced the findings — verify against those commits rather than asserting it.\n", "is_subdir": false}, {"name": "ticket-06-services-unavailable.md", "rel_path": "ticket-06-services-unavailable.md", "path": "ticket-06-services-unavailable.md", "size": "1.7KB", "icon": "📝", "type": "markdown", "type_name": "Markdown", "content": "---\nid: ticket-06\nsignal: diagnose-agent\ncode: SVC-301\ntitle: Docling and ClickHouse are configured but not running, so the ingest path is degraded\npriority: medium\nlabels: [services, ingestion, docker]\nfiles:\n  - docker-compose.yml\n  - ../projects/nanobionic-laboratory-md/.env\ndedupe_key: manual:services-not-running\n---\n\n## Evidence\n\n`doctor`:\n\n```json\n\"doclingUrl\": null,\n\"clickhouseUrl\": \"http://127.0.0.1:18123\"\n```\n\n`docker ps` shows five containers, none of them this project's — no ClickHouse, no Docling.\n`diagnose-agent scan --services` reports nothing because nothing is configured to probe\nagainst.\n\n`projects/nanobionic-laboratory-md/.env` does not exist at all (`CFG-601`), so every service\nURL falls back to its default.\n\n## Why this matters\n\nBoth degradations are silent by design, which is right for resilience and wrong for\nvisibility:\n\n- **No Docling** means scans and image-only PDFs fall back to local extraction. The corpus\n  already carries 53 OCR'd files; re-running conversion without Docling would produce a\n  different, quieter corpus rather than an error.\n- **No ClickHouse** means `DT_SEARCH_BACKEND` falls back to the in-memory backend. Query\n  results stay correct for small corpora and diverge from production behaviour silently.\n\nThe system is running in a degraded mode that no artifact records.\n\n## Acceptance criteria\n\n- `cp .env.example .env` in the project (repair-agent strategy `seed-env` already covers\n  this) and fill the service URLs.\n- `make up && make service-check` green, or a recorded decision that this workspace runs\n  offline by choice.\n- The iteration receipt records which backends were actually used, so a degraded run is\n  distinguishable from a full one after the fact.\n", "is_subdir": false}, {"name": "ticket-07-docs-paths-drift.md", "rel_path": "ticket-07-docs-paths-drift.md", "path": "ticket-07-docs-paths-drift.md", "size": "2.0KB", "icon": "📝", "type": "markdown", "type_name": "Markdown", "content": "---\nid: ticket-07\nsignal: diagnose-agent\ncode: DOC-501, DOC-503\ntitle: Six documented paths do not resolve and one internal link is broken\npriority: low\nlabels: [docs, drift]\nfiles:\n  - docs/AUTONOMY_EXAMPLES.md\n  - docs/QUICK_SOURCE_RECIPES.md\n  - docs/EVENT_HISTORY_AUTONOMY.md\n  - docs/source/AUTONOMY_CONTRACTS(1).md\ndedupe_key: diagnose:DOC-501:twin-dsl-docs\n---\n\n## Evidence\n\n`diagnose-agent scan --only docs`:\n\n```\nDOC-501  docs/AUTONOMY_EXAMPLES.md      /srv/customer/history.zip\nDOC-501  docs/AUTONOMY_EXAMPLES.md      /srv/customer/specification.pdf\nDOC-501  docs/AUTONOMY_EXAMPLES.md      /srv/git/device-runtime\nDOC-501  docs/EVENT_HISTORY_AUTONOMY.md /home/tom/github/bioxfoundry/idea/Atvirojo\nDOC-501  docs/QUICK_SOURCE_RECIPES.md   /home/user/github/todo2code\nDOC-501  docs/QUICK_SOURCE_RECIPES.md   /var/log/twin\nDOC-503  docs/source/AUTONOMY_CONTRACTS(1).md -> CONTRACT_GENERATION.md\n```\n\n## Why this matters\n\nThese are mostly illustrative placeholders (`/srv/...`, `/var/log/twin`), which is a\nlegitimate style — but a reader cannot tell an illustration from a stale real path, and the\nprobe cannot either. `/home/user/github/todo2code` in particular reads as runnable and is\nnot.\n\n`docs/EVENT_HISTORY_AUTONOMY.md:/home/tom/.../idea/Atvirojo` is a truncation artefact: the\nreal path contains spaces (`Atvirojo kodo biofoundry studija-1.pdf`) and is unquoted, so\nboth the probe and a copy-pasting reader break on it. Quoting it fixes both.\n\n## Acceptance criteria\n\n- Illustrative paths are marked as such (a placeholder convention such as `/path/to/...`, or\n  a sentence saying the block is an example), so `DOC-501` distinguishes them from drift.\n- The unquoted path with spaces is quoted.\n- The broken relative link is fixed or removed.\n- `diagnose-agent scan --only docs --fail-on warning` is clean.\n\nNote: the four `DOC-502` findings on `EVENT_HISTORY_AUTONOMY.md` are **not** in scope. That\nfile is a historical record of what was actually executed and must keep saying so.\n", "is_subdir": false}, {"name": "ticket-08-empty-source-role.md", "rel_path": "ticket-08-empty-source-role.md", "path": "ticket-08-empty-source-role.md", "size": "1.2KB", "icon": "📝", "type": "markdown", "type_name": "Markdown", "content": "---\nid: ticket-08\nsignal: diagnose-agent\ncode: SRC-102\ntitle: The archive role is declared but empty, so it grounds nothing\npriority: low\nlabels: [sources, grounding]\nfiles:\n  - ../projects/nanobionic-laboratory-md/project.projectdsl\ndedupe_key: diagnose:SRC-102:data/archives\n---\n\n## Evidence\n\n```\nSRC-102  data/archives  (empty directory)\n```\n\n`project.projectdsl` declares `SOURCE archive \"data/archives\" …`, the directory exists, and\nit contains no readable file.\n\n## Why this matters\n\n`project-verify` passes this: the path exists. The role therefore looks covered in the\nproject configuration while contributing nothing to the resource snapshot — a grounding gap\nhidden behind a green check. This is precisely the case `diagnose-agent`'s source probe was\nwritten to catch beyond `project-verify`.\n\nAny blueprint component listing `archive` among its `sourceRoles` falls back to whole-role\nURIs, or to `role-fallback-empty-filter` grounding, and still renders a box in the dashboard.\n\n## Acceptance criteria\n\nEither import the archival material (one `.zip` in `data/archives`, or\n`project-add-source <config> archive <path>`), or remove the `SOURCE archive` line. A role\nthat grounds nothing should not be declared.\n", "is_subdir": false}, {"name": "ticket-09-twin-probes-missing.md", "rel_path": "ticket-09-twin-probes-missing.md", "path": "ticket-09-twin-probes-missing.md", "size": "1.5KB", "icon": "📝", "type": "markdown", "type_name": "Markdown", "content": "---\nid: ticket-09\nsignal: manual\ntitle: twin-probes is unavailable, so runtime evidence has no physical source\npriority: medium\nlabels: [autonomy, evidence, runtime-loop]\nfiles:\n  - src/adapters/twin-probes.ts\ndedupe_key: manual:twin-probes-unavailable\n---\n\n## Evidence\n\n`doctor`:\n\n```json\n\"twinProbes\": { \"bin\": \"\", \"available\": false }\n```\n\nRuntime observations for `nanobionic-laboratory-md` currently number 9 and are derived from\nfiles under `logs/` and `environment/` — that is, from a fixture-shaped `runtime.jsonl` and\n`current.json`, not from a device.\n\n## Why this matters\n\nThe execution loop is documented as updating the Twin only after hard runtime gates. Those\ngates evaluate observations that presently come from static files in the project directory.\nThe loop is structurally correct and empirically empty: nothing physical is being observed,\nso `ScenePublishAllowed` and friends are gating on values a human wrote.\n\n`probes-ingest` exists as a CLI and `TwinProbesAdapter` is implemented, so the integration\npoint is there. What is missing is a real `subactor.autonom-cycle/v1` producer.\n\n## Acceptance criteria\n\n- `twin-probes` on `PATH` (or `TWIN_PROBES_BIN` set) and `doctor` reporting `available: true`.\n- One real `probes-ingest` cycle folded into an iteration, with the resulting evidence\n  visible in `current/observations.json` and attributable to a probe rather than a file.\n- If no hardware is available, say so explicitly in the project README rather than leaving\n  the fixture indistinguishable from a live feed.\n", "is_subdir": false}, {"name": "ticket-10-degraded-run-not-recorded.md", "rel_path": "ticket-10-degraded-run-not-recorded.md", "path": "ticket-10-degraded-run-not-recorded.md", "size": "1.9KB", "icon": "📝", "type": "markdown", "type_name": "Markdown", "content": "---\nid: ticket-10\nsignal: manual\ntitle: A degraded run is indistinguishable from a full one after the fact\npriority: medium\nlabels: [observability, receipts, autonomy]\nfiles:\n  - src/runtime/living-project.ts\n  - src/core/types.ts\ndedupe_key: manual:receipt-missing-capability-record\n---\n\n## Evidence\n\nFour independent degradations are active in this workspace right now, and none of them\nappears in the iteration receipt:\n\n| capability | state | how the run degrades |\n| --- | --- | --- |\n| `todo2code` | unavailable | development evidence becomes a fixture |\n| `twin-probes` | unavailable | runtime observations come from static files |\n| Docling | not configured | scans fall back to local extraction |\n| ClickHouse | not running | search falls back to the in-memory backend |\n\n`current/generation-audit.json` records LLM mode and degradation per generated document,\nwhich is the right idea — but it does not cover adapters, services or search backend.\n\n## Why this matters\n\nEvery one of these fallbacks is deliberate and correct: the system should keep running when\na dependency is missing. The cost is that a receipt from a fully-provisioned run and a\nreceipt from this one look the same, so an operator comparing two twin revisions cannot tell\nwhether a difference came from the data or from what happened to be installed.\n\nFor an autonomous loop this is worse than for a manual one, because nobody is watching the\nconsole output where the fallback was mentioned once.\n\n## Acceptance criteria\n\n- The iteration receipt carries a `capabilities` block recording, per run: adapter\n  availability, service reachability, search backend actually used, and converter chain.\n- `diagnose-agent` reports when the current twin was produced by a degraded run.\n- A test asserts that a run with an adapter forced unavailable is marked as such in the\n  receipt rather than silently equal to a full run.\n", "is_subdir": false}, {"name": "ticket-11-gate-scanned-one-project.md", "rel_path": "ticket-11-gate-scanned-one-project.md", "path": "ticket-11-gate-scanned-one-project.md", "size": "2.7KB", "icon": "📝", "type": "markdown", "type_name": "Markdown", "content": "---\nid: ticket-11\nsignal: manual\ntitle: The local CI gate scanned only one project, so a critical finding passed unnoticed\npriority: high\nlabels: [ci, gate, coverage, fixed]\nstatus: fixed\nfiles:\n  - ../ci/local-ci.sh\ndedupe_key: manual:local-ci-single-project-scan\n---\n\n## Evidence\n\n`ci/local-ci.sh` selected a project to inspect like this:\n\n```bash\nfor candidate in \"$ROOT/projects\"/*/; do\n  if [ -f \"$candidate/project.projectdsl\" ]; then args+=(--project \"${candidate%/}\"); break; fi\ndone\n```\n\nThe `break` stops at the first match. With two projects present, glob order picks\n`nanobionic-laboratory` — which carries the safe policy — and `nanobionic-laboratory-md`,\nwhich carries the `CFG-603` **error** described in ticket-01, was never scanned.\n\nThe gate therefore reported `PASS diagnose (no findings at or above: error)` and allowed\na push, while a critical finding sat in the workspace. It was found by running\n`diagnose-agent` by hand against the second project, not by the gate.\n\nA second defect surfaced while fixing the first. The refactor used:\n\n```bash\nif node \"$DIAG\" \"${args[@]}\"; then pass; return; fi\nlocal status=$?          # always 0\n```\n\nAfter a completed `if`, `$?` is the status of the `if` statement, not of its condition, so\nevery failure was reported as `agent error, exit 0`. Observed in the first corrected run\nbefore the exit code was captured directly.\n\n## Why this matters\n\nThis is the exact failure the gate was written to prevent — \"not run\" looking like \"passed\".\nThe design note in `ci/README.md` says a skipped stage must be reported separately and never\nsilently pass; the same reasoning applies to a *target* that was never examined. A gate whose\nverdict depends on directory order is not a gate.\n\nIt also means every green gate result reported before this fix covered one project only.\n\n## Fix\n\n`ci/local-ci.sh` now scans **every** directory under `projects/` that holds a\n`project.projectdsl`, writing `diagnostic-report-<name>.json` per project and failing if any\nof them fails. With no project present it still probes the workspace itself, so docs, config,\ncorpus and build checks are never skipped by accident. The exit code is captured directly\nfrom the command rather than read after an `if`.\n\nVerified: the gate now reports\n`PASS diagnose:nanobionic-laboratory` / `FAIL diagnose:nanobionic-laboratory-md`, surfaces\nthe `CFG-603` error with its codex explanation, and offers `restore-policy` as a dry-run\nrepair.\n\n## Follow-up\n\nConsider whether `diagnose-agent` should accept `--project` more than once and aggregate\ninto a single report, rather than the gate looping. One report per project is currently\nsimpler to attribute and keeps the repair-agent hand-off per project.\n", "is_subdir": false}, {"name": "calls.mmd", "rel_path": "calls.mmd", "path": "calls.mmd", "size": "74.7KB", "icon": "📈", "type": "mermaid", "type_name": "Mermaid", "content": "flowchart LR\n%% generated in 0.02s\n    subgraph js__f2md\n        js__f2md__src__types__ConversionError__super[&quot;super&quot;]\n        js__f2md__src__chain__ConverterChain__started[&quot;started&quot;]\n        js__f2md__src__converters__MammothConverter__clipped[&quot;clipped&quot;]\n        js__f2md__src__converters__execFileAsync[&quot;execFileAsync&quot;]\n        js__f2md__src__tree__walkFiles[&quot;walkFiles&quot;]\n        js__f2md__src__detect__detectDocumentKind[&quot;detectDocumentKind&quot;]\n        js__f2md__src__converters__ScadSourceConverter__convert[&quot;convert&quot;]\n        js__f2md__src__converters__TextConverter__convert[&quot;convert&quot;]\n        js__f2md__src__converters__MammothConverter__htmlToDocument[&quot;htmlToDocument&quot;]\n        js__f2md__src__tree__yamlScalar[&quot;yamlScalar&quot;]\n        js__f2md__src__tree__convertTree[&quot;convertTree&quot;]\n        js__f2md__src__converters__LocalToolConverter__convert[&quot;convert&quot;]\n        js__f2md__src__converters__MammothConverter__convertToHtml[&quot;convertToHtml&quot         function renderFileList(filter = '') {

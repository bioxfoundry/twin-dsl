[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "f2md"
version = "0.5.33"
description = "Convert any file to a unified Markdown envelope, with provenance and a graceful converter chain."
readme = "README.md"
requires-python = ">=3.9"
license = "Apache-2.0"
license-files = ["LICENSE"]
authors = [{ name = "Softreck", email = "info@softreck.com" }, {name = "Tom Sapletta",email = "tom@sapletta.com"}]
keywords = ["markdown", "conversion", "pdf", "docx", "docling", "pandoc", "ingestion", "rag"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: Apache Software License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Topic :: Text Processing :: Markup :: Markdown",
  "Typing :: Typed",
]
# The core chain is stdlib-only on purpose: text and code files convert with no install
# footprint, and heavier backends stay opt-in.
dependencies = []

[project.optional-dependencies]
# Structured Markdown from PDFs with a text layer — better than a flat pdftotext dump.
pymupdf = ["pymupdf4llm>=0.0.17; python_version>='3.10'"]
# Broad format coverage: Office, HTML, spreadsheets, images.
markitdown = ["markitdown>=0.1; python_version>='3.10'"]
# Run Docling in-process instead of over HTTP.
docling = ["docling>=2.0; python_version>='3.10'"]
# Offline language detection — without it documents stay untagged rather than being guessed at.
lang = ["py3langid>=0.3"]
# Offline neural translation. Nothing leaves the machine, which is what makes it usable for
# confidential documents; the hosted engine needs no extra (urllib) but does need a key.
translate = ["argostranslate>=1.9", "py3langid>=0.3"]
# Everything optional at once.
all = [
  "pymupdf4llm>=0.0.17; python_version>='3.10'",
  "markitdown>=0.1; python_version>='3.10'",
  "docling>=2.0; python_version>='3.10'",
  "argostranslate>=1.9",
  "py3langid>=0.3",
]
dev = ["pytest>=7", "mypy>=1.8", "ruff>=0.5"]

[project.urls]
Homepage = "https://github.com/bioxfoundry/twin-dsl/tree/main/py/f2md"
Source = "https://github.com/bioxfoundry/twin-dsl/tree/main/py/f2md"
Issues = "https://github.com/bioxfoundry/twin-dsl/issues"

[project.scripts]
f2md = "f2md.cli:main"
f2md-audit = "f2md.audit:main"
f2md-intent = "f2md.intent_compile:main"

[tool.hatch.build.targets.wheel]
packages = ["src/f2md"]

[tool.hatch.build.targets.sdist]
include = ["src/f2md", "tests", "README.md", "LICENSE"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 120
target-version = "py39"

[tool.mypy]
strict = true
python_version = "3.9"

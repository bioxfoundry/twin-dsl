name: Runtime CI
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - run: npm run verify
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: autonomy-verification
          path: |
            .autonomy-demo
            .living-project-demo
            .biofoundry-run
            verification

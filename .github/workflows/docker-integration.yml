name: Docker Integration
on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'docker-compose.yml'
      - 'deploy/**'
      - 'src/adapters/**'
      - '.github/workflows/docker-integration.yml'
permissions:
  contents: read
jobs:
  docker:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - run: npm run build
      - run: docker compose config -q
      - run: docker compose build runtime docling
      - run: docker compose up -d --wait clickhouse docling
      - run: docker compose run --rm runtime service-check
      - if: always()
        run: docker compose logs --no-color > verification/docker-compose.log || true
      - if: always()
        run: docker compose down -v
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: docker-integration-logs
          path: verification/docker-compose.log

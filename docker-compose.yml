name: ${COMPOSE_PROJECT_NAME:-subactor-digital-twin-runtime}
services:
  clickhouse:
    image: clickhouse/clickhouse-server:26.3
    restart: unless-stopped
    environment:
      # Without these the image logs "disabling network access for user 'default'" and restricts
      # it to 127.0.0.1, so every cross-container query fails with HTTP 401. Local dev defaults;
      # override in .env for anything reachable beyond this host.
      CLICKHOUSE_USER: ${CLICKHOUSE_USER:-digital_twin}
      CLICKHOUSE_PASSWORD: ${CLICKHOUSE_PASSWORD:-digital_twin_local}
    ports:
      - "${CLICKHOUSE_HTTP_PORT:-18123}:8123"
      - "${CLICKHOUSE_NATIVE_PORT:-19000}:9000"
    volumes:
      - clickhouse-data:/var/lib/clickhouse
      - ./deploy/clickhouse/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:8123/ping | grep -q Ok"]
      interval: 10s
      timeout: 5s
      retries: 12

  docling:
    build: ./deploy/docling
    restart: unless-stopped
    ports:
      - "${DOCLING_PORT:-15001}:5001"
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://127.0.0.1:5001/health')\""]
      interval: 15s
      timeout: 10s
      retries: 20

  runtime:
    build:
      context: .
      dockerfile: deploy/runtime/Dockerfile
    command: ["doctor"]
    environment:
      CLICKHOUSE_URL: http://clickhouse:8123
      CLICKHOUSE_USER: ${CLICKHOUSE_USER:-digital_twin}
      CLICKHOUSE_PASSWORD: ${CLICKHOUSE_PASSWORD:-digital_twin_local}
      DOCLING_URL: http://docling:5001
      DT_SEARCH_BACKEND: clickhouse
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY:-}
      OPENROUTER_MODEL: ${OPENROUTER_MODEL:-mistralai/codestral-2508}
      OPENROUTER_DATA_COLLECTION: ${OPENROUTER_DATA_COLLECTION:-deny}
      T2C_ROOT: /todo2code
      T2C_BIN: /todo2code/dist/src/cli.js
    volumes:
      - ${T2C_HOST_ROOT:-./vendor/todo2code}:/todo2code:ro
    depends_on:
      clickhouse:
        condition: service_healthy
      docling:
        condition: service_healthy

networks:
  # Pinned to an explicit subnet: on hosts running many compose stacks, Docker's default
  # address pools (172.16-172.31 plus 192.168.0.0/16 in /20 blocks) run out and network
  # creation fails with "all predefined address pools have been fully subnetted".
  # Override with DT_NETWORK_SUBNET if 10.201.7.0/24 collides with your network.
  default:
    ipam:
      config:
        - subnet: ${DT_NETWORK_SUBNET:-10.201.7.0/24}

volumes:
  clickhouse-data:
